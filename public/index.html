<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pausa Lectora</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f1e8; color: #263b34; font-family: Arial, sans-serif; }
    main { max-width: 580px; margin: 10vh auto; padding: 36px 24px; }
    .marca { font-size: 14px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
    .tarjeta { margin-top: 28px; background: white; border-radius: 16px; padding: 32px; box-shadow: 0 8px 30px #263b3412; }
    h1 { font-family: Georgia, serif; font-size: clamp(32px, 6vw, 46px); line-height: 1.1; margin: 0 0 18px; }
    p { line-height: 1.6; color: #52635c; }
    label { display: block; font-weight: bold; margin: 28px 0 8px; }
    input, button { width: 100%; padding: 14px; border-radius: 8px; font: inherit; }
    input { border: 1px solid #a4b1aa; }
    button { background: #315e4b; color: white; border: 0; margin-top: 12px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .nota { font-size: 13px; }
    #estado { min-height: 24px; color: #315e4b; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <div class="marca">✦ Pausa Lectora</div>
    <div class="tarjeta">
      <h1>Un momento para volver a leer.</h1>
      <p>Empieza con una pequeña pausa: recibe un correo de bienvenida con una idea para hacer espacio a los libros en tu día.</p>
      <form id="formulario">
        <label for="email">Tu correo electrónico</label>
        <input id="email" type="email" name="email" placeholder="tu@correo.com" autocomplete="email" required maxlength="254">
        <button type="submit">Recibir mi bienvenida</button>
      </form>
      <p class="nota">Al enviar el formulario, aceptas recibir este correo de bienvenida. No añadiremos tu dirección a una lista de envíos.</p>
      <p id="estado" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script>
    const form = document.querySelector('#formulario');
    const status = document.querySelector('#estado');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      status.textContent = 'Enviando...';
      try {
        const response = await fetch('/suscribir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: form.email.value }) });
        const data = await response.json();
        status.textContent = response.ok ? data.message : data.error;
        if (response.ok) form.reset();
      } catch { status.textContent = 'No fue posible conectar. Inténtalo de nuevo.'; }
      button.disabled = false;
    });
  </script>
</body>
</html>
